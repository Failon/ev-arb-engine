services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ev_arb
      POSTGRES_USER: researcher
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U researcher -d ev_arb"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
